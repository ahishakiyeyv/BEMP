<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Protected - Burundi Environmental Monitoring Platform</title>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <label for="sidebar-toggle" class="toggle-btn">
          <i class="fas fa-bars"></i>
        </label>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search stations, provinces..." />
        </div>
      </div>
      <div class="topbar-center">
        <div class="topbar-info">
          <span class="topbar-date">08 Jun 2026 · 16:40</span>
          <button class="location-btn">
            <i class="fas fa-map-marker-alt"></i>
            Burundi
          </button>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-actions">
          <button class="notification-btn">
            <i class="fas fa-bell"></i>
            <span class="notification-count">3</span>
          </button>
          <div class="user-profile">
            <img src="img/user.webp" alt="User Avatar" />
            <span class="user-name">John Doe</span>
          </div>
        </div>
      </div>
    </header>
    <section class="section">
      <div class="sidebar-left">
        <div class="sidebar-head">
          <img src="img/user.webp" alt="BEMP" class="sidebar-img" />
          <h4>Burundi EMP</h4>
        </div>
        <div class="sidebar-menu">
          <h3>Layers</h3>
          <ul>
            <li>
              <a class="menu-item" href="index.html"
                ><i class="fa-solid fa-chart-line"></i> Dashboard</a
              >
            </li>
            <li>
              <a class="menu-item" href="province.html"
                ><i class="fa-solid fa-globe"></i> Provinces</a
              >
            </li>
            <li>
              <a class="menu-item" href="areas.html"
                ><i class="fa-solid fa-earth-europe"></i> New Provinces</a
              >
            </li>
            <li>
              <a class="menu-item" href="lakes.html"
                ><i class="fa-solid fa-water"></i> Lakes</a
              >
            </li>
            <li>
              <a class="menu-item active" href="areas.html"
                ><i class="fa-solid fa-hands-holding-circle"></i> Protected
                Areas</a
              >
            </li>
            <li>
              <a class="menu-item" href="roads.html"
                ><i class="fa-solid fa-road"></i> Roads</a
              >
            </li>
          </ul>
        </div>
      </div>
      <div class="mainbar">
        <div id="map"></div>
      </div>
      <div class="sidebar-right">
        <h1>sidebar right</h1>
      </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
      var map = L.map("map").setView([-3.3731, 29.9189], 9);

      // Base Map
      var osm = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution: "&copy; OpenStreetMap contributors",
        },
      ).addTo(map);
    </script>
  </body>
</html>
