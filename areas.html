<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/area.css" />
    <title>Protected - Burundi Environmental Monitoring Platform</title>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <label for="sidebar-toggle" class="toggle-btn">
          <i class="fas fa-bars"></i>
        </label>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search stations, provinces..." />
        </div>
      </div>
      <div class="topbar-center">
        <div class="topbar-info">
          <span class="topbar-date">08 Jun 2026 · 16:40</span>
          <button class="location-btn">
            <i class="fas fa-map-marker-alt"></i>
            Burundi
          </button>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-actions">
          <button class="notification-btn">
            <i class="fas fa-bell"></i>
            <span class="notification-count">3</span>
          </button>
          <div class="user-profile">
            <img src="img/user.webp" alt="User Avatar" />
            <span class="user-name">John Doe</span>
          </div>
        </div>
      </div>
    </header>
    <section class="section">
      <div class="sidebar-left">
        <div class="sidebar-head">
          <img src="img/user.webp" alt="BEMP" class="sidebar-img" />
          <h4>Burundi EMP</h4>
        </div>
        <div class="sidebar-menu">
          <h3>Layers</h3>
          <ul>
            <li>
              <a class="menu-item" href="index.html"
                ><i class="fa-solid fa-chart-line"></i> Dashboard</a
              >
            </li>
            <li>
              <a class="menu-item" href="province.html"
                ><i class="fa-solid fa-globe"></i> Communes</a
              >
            </li>
            <li>
              <a class="menu-item" href="new-province.html"
                ><i class="fa-solid fa-earth-europe"></i> New Provinces</a
              >
            </li>
            <li>
              <a class="menu-item" href="lakes.html"
                ><i class="fa-solid fa-water"></i> Lakes</a
              >
            </li>
            <li>
              <a class="menu-item active" href="areas.html"
                ><i class="fa-solid fa-hands-holding-circle"></i> Protected
                Areas</a
              >
            </li>
            <li>
              <a class="menu-item" href="roads.html"
                ><i class="fa-solid fa-road"></i> Roads</a
              >
            </li>
          </ul>
        </div>
      </div>
      <div class="mainbar">
        <div id="map"></div>
      </div>
      <div class="sidebar-right">
        <div class="overview-container" aria-live="polite">
          <p class="area-empty">Click on an area to display its details.</p>
          <div class="area-details" hidden>
            <h2 class="area-heading" id="area-heading"></h2>
            <div class="indice">
              <i class="fa-solid fa-location-dot"></i>
              <p class="indice-location" id="area-location"></p>
            </div>
            <div class="area-about">
              <p class="area-text" id="area-description"></p>
            </div>
            <div class="area-info">
              <p class="text-para">
                <span class="area-label">Local name</span>
                <span class="area-value" id="area-local-name"></span>
              </p>
              <p class="text-para">
                <span class="area-label">Type</span>
                <span class="area-value" id="area-type"></span>
              </p>
              <p class="text-para">
                <span class="area-label">Area</span>
                <span class="area-value" id="area-size"></span>
              </p>
              <p class="text-para">
                <span class="area-label">Status</span>
                <span class="area-value" id="area-status"></span>
              </p>
              <p class="text-para">
                <span class="area-label">Established</span>
                <span class="area-value" id="area-year"></span>
              </p>
              <p class="text-para">
                <span class="area-label">IUCN category</span>
                <span class="area-value" id="area-category"></span>
              </p>
              <p class="text-para">
                <span class="area-label">Management authority</span>
                <span class="area-value" id="area-authority"></span>
              </p>
              <p class="text-para">
                <span class="area-label">Governance</span>
                <span class="area-value" id="area-governance"></span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
      var map = L.map("map", { preferCanvas: true }).setView(
        [-3.3731, 29.9189],
        9,
      );

      const esri = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        { attribution: "Tiles © Esri — Esri, DeLorme, NAVTEQ" },
      ).addTo(map);

      var osm = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution: "&copy; OpenStreetMap contributors",
        },
      );

      const googleSatellite = L.tileLayer(
        "https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
        {
          maxZoom: 20,
          attribution: "&copy; Google",
        },
      );

      const openTopoMap = L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 17,
          attribution:
            "Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)",
        },
      );

      // Base map
      esri.addTo(map);

      const baseMaps = {
        "Esri World Light Gray": esri,
        OpenStreetMap: osm,
        "Google Satellite": googleSatellite,
        "Topo Map": openTopoMap,
      };

      L.control.layers(baseMaps).addTo(map);

      //fetch a map of burundi borders
      fetch("data/burundi.geojson")
        .then((response) => response.json())
        .then((data) => {
          L.geoJSON(data, {
            interactive: false,
            style: { fillOpacity: 0 },
          }).addTo(map);
        });

      //fetch a map of protected areas
      fetch("data/National_Parks.geojson")
        .then((response) => response.json())
        .then((data) => {
          L.geoJSON(data, {
            smoothFactor: 2,
            onEachFeature: function (feature, layer) {
              const properties = feature.properties;
              const areaName =
                properties.NAME_ENG || properties.NAME || "Protected area";
              const popupHTML = `
                <div class="station-popup">
                  <div class="station-popup-header">
                    <h3 class="station-name">${areaName}</h3>
                  </div>
                  <div class="station-popup-body">
                    <div class="popup-field">
                      <span class="popup-label"><i class="fas fa-mountain"></i> Name</span>
                      <span class="popup-value">${properties.NAME || "Not provided"}</span>
                    </div>
                    <div class="popup-field">
                      <span class="popup-label"><i class="fas fa-thermometer"></i>Size Area:</span>
                      <span class="popup-value">${properties.REP_AREA ?? "Not provided"} km²</span>
                    </div>
                    
                  </div>
                </div>
              `;
              layer.bindPopup(popupHTML);
              layer.on("click", function () {
                const designation =
                  properties.DESIG_ENG || properties.DESIG || "Protected area";
                const areaSize =
                  properties.REP_AREA == null
                    ? "Not provided"
                    : `${properties.REP_AREA} km²`;
                const statusYear = properties.STATUS_YR || "Not provided";

                document.querySelector(".area-empty").hidden = true;
                document.querySelector(".area-details").hidden = false;
                document.getElementById("area-heading").textContent = areaName;
                document.getElementById("area-location").textContent =
                  "Burundi";
                document.getElementById("area-description").textContent =
                  `${areaName} is a ${designation.toLowerCase()} in Burundi, covering ${areaSize}. ` +
                  `It is ${properties.STATUS || "a protected area"} and was established in ${statusYear}.`;
                document.getElementById("area-local-name").textContent =
                  properties.NAME || "Not provided";
                document.getElementById("area-type").textContent = designation;
                document.getElementById("area-size").textContent = areaSize;
                document.getElementById("area-status").textContent =
                  properties.STATUS || "Not provided";
                document.getElementById("area-year").textContent = statusYear;
                document.getElementById("area-category").textContent =
                  properties.IUCN_CAT || "Not provided";
                document.getElementById("area-authority").textContent =
                  properties.MANG_AUTH || "Not provided";
                document.getElementById("area-governance").textContent =
                  properties.GOV_TYPE || "Not provided";
              });
            },
            style: function (feature) {
              return {
                color: "green",
                weight: 2,
                fillOpacity: 0.5,
              };
            },
          }).addTo(map);
        });
    </script>
    <script src="js/utils.js"></script>
  </body>
</html>
