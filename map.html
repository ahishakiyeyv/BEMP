<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/map.css" />
    <title>Maps - BEMP</title>
  </head>
  <body>
    <!-- Sidebar Toggle Checkbox (hidden) -->
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle" />

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <label for="sidebar-toggle" class="toggle-btn">
          <i class="fas fa-bars"></i>
        </label>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search stations, provinces..." />
        </div>
      </div>
      <div class="topbar-center">
        <div class="topbar-info">
          <span class="topbar-date">08 Jun 2026 · 16:40</span>
          <button class="location-btn">
            <i class="fas fa-map-marker-alt"></i>
            Burundi
          </button>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-actions">
          <button class="topbar-action">
            <i class="fas fa-satellite"></i>
            Satellite
          </button>
          <button class="topbar-action">
            <i class="fas fa-layer-group"></i>
            Layers
          </button>
        </div>
        <button class="notification-btn" aria-label="Notifications">
          <i class="fas fa-bell"></i>
          <span class="notification-badge"></span>
        </button>
        <div class="user-profile">
          <span class="user-name">Y.I Ahishakiye</span>
          <div class="avatar">EB</div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-map-marker-alt"></i>
        <span>BEMP</span>
      </div>

      <nav class="sidebar-menu">
        <a href="index.html" class="menu-item" data-label="Dashboard">
          <i class="fas fa-chart-line"></i>
          <span class="label">Dashboard</span>
        </a>
        <a href="map.html" class="menu-item active" data-label="Map">
          <i class="fas fa-map"></i>
          <span class="label">Map</span>
        </a>
        <a href="#" class="menu-item" data-label="Merchants">
          <i class="fas fa-users"></i>
          <span class="label">Merchants</span>
        </a>
        <a href="#" class="menu-item" data-label="Transactions">
          <i class="fas fa-exchange-alt"></i>
          <span class="label">Transactions</span>
        </a>
        <a href="#" class="menu-item" data-label="Analytics">
          <i class="fas fa-chart-pie"></i>
          <span class="label">Analytics</span>
        </a>
        <a href="#" class="menu-item" data-label="Settings">
          <i class="fas fa-cog"></i>
          <span class="label">Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="menu-item" data-label="Logout">
          <i class="fas fa-sign-out-alt"></i>
          <span class="label">Logout</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div id="map" class="map-container"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/map.js"></script>
  </body>
</html>
