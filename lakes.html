<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/lakes.css" />
    <title>Lakes - Burundi Environmental Monitoring Platform</title>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <label for="sidebar-toggle" class="toggle-btn">
          <i class="fas fa-bars"></i>
        </label>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search stations, provinces..." />
        </div>
      </div>
      <div class="topbar-center">
        <div class="topbar-info">
          <span class="topbar-date">08 Jun 2026 · 16:40</span>
          <button class="location-btn">
            <i class="fas fa-map-marker-alt"></i>
            Burundi
          </button>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-actions">
          <button class="notification-btn">
            <i class="fas fa-bell"></i>
            <span class="notification-count">3</span>
          </button>
          <div class="user-profile">
            <img src="img/user.webp" alt="User Avatar" />
            <span class="user-name">John Doe</span>
          </div>
        </div>
      </div>
    </header>
    <section class="section">
      <div class="sidebar-left">
        <div class="sidebar-head">
          <img src="img/user.webp" alt="BEMP" class="sidebar-img" />
          <h4>Burundi EMP</h4>
        </div>
        <div class="sidebar-menu">
          <h3>Layers</h3>
          <ul>
            <li>
              <a class="menu-item" href="index.html"
                ><i class="fa-solid fa-chart-line"></i> Dashboard</a
              >
            </li>
            <li>
              <a class="menu-item" href="province.html"
                ><i class="fa-solid fa-globe"></i> Provinces</a
              >
            </li>
            <li>
              <a class="menu-item" href="new-province.html"
                ><i class="fa-solid fa-earth-europe"></i> New Provinces</a
              >
            </li>
            <li>
              <a class="menu-item active" href="lakes.html"
                ><i class="fa-solid fa-water"></i> Lakes</a
              >
            </li>
            <li>
              <a class="menu-item" href="areas.html"
                ><i class="fa-solid fa-hands-holding-circle"></i> Protected
                Areas</a
              >
            </li>
            <li>
              <a class="menu-item" href="roads.html"
                ><i class="fa-solid fa-road"></i> Roads</a
              >
            </li>
          </ul>
        </div>
      </div>
      <div class="mainbar">
        <div id="map"></div>
      </div>
      <div class="sidebar-right">
        <div class="sidebar-content">
          <div class="head-section">
            <i class="fa-solid fa-cloud-rain"></i>
            <h3 class="head-text">Rainfall</h3>
          </div>
          <div class="content">
            <h2 class="title-paragraph">86.4 mm</h2>
            <p class="text-para">Last 24 hours</p>
            <div class="span-box">
              <i class="fa-solid fa-arrow-trend-up"></i>
              <span class="span-text">+18.5% vs normal</span>
            </div>
          </div>
        </div>
        <div class="sidebar-content">
          <div class="head-section">
            <i class="fa-solid fa-water"></i>
            <h3 class="head-text">Water Level</h3>
          </div>
          <div class="content">
            <h2 class="title-paragraph">772.4 m</h2>
            <p class="text-para">Lake Tanganyika</p>
            <div class="span-box">
              <i class="fa-solid fa-arrow-trend-up"></i>
              <span class="span-text">+0.32 m</span>
            </div>
          </div>
        </div>
        <div class="sidebar-content">
          <div class="head-section">
            <i class="fa-solid fa-cloud-rain"></i>
            <h3 class="head-text">Rainfall - Last 30 days</h3>
          </div>
          <div class="content">
            <canvas id="rainfallChart"></canvas>
          </div>
        </div>
        <div class="sidebar-content">
          <div class="head-section">
            <i class="fa-solid fa-water"></i>
            <h3 class="head-text">Water Level - Last 30 days</h3>
          </div>
          <div class="content">
            <canvas id="waterLevelChart"></canvas>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      var map = L.map("map", { preferCanvas: true }).setView(
        [-3.3731, 29.9189],
        9,
      );

      const esri = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        { attribution: "Tiles © Esri — Esri, DeLorme, NAVTEQ" },
      ).addTo(map);

      var osm = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution: "&copy; OpenStreetMap contributors",
        },
      );

      const googleSatellite = L.tileLayer(
        "https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
        {
          maxZoom: 20,
          attribution: "&copy; Google",
        },
      );

      const openTopoMap = L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 17,
          attribution:
            "Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)",
        },
      );

      // Base map
      esri.addTo(map);

      const baseMaps = {
        "Esri Light Gray": esri,
        OpenStreetMap: osm,
        "Google Satellite": googleSatellite,
        "Topo Map": openTopoMap,
      };

      L.control.layers(baseMaps).addTo(map);

      //fetch a map of burundi borders
      fetch("data/burundi.geojson")
        .then((response) => response.json())
        .then((data) => {
          L.geoJSON(data).addTo(map);
        });

      // fetch the GeoJSON data and add it to the map
      fetch("data/Lakes.geojson")
        .then((response) => response.json())
        .then((data) => {
          L.geoJSON(data, {
            smoothFactor: 2,
            style: function (feature) {
              return {
                color: "blue",
                weight: 2,
                fillOpacity: 0.5,
              };
            },
          }).addTo(map);
        });
    </script>
    <script src="js/chart.js"></script>
    <script src="js/utils.js"></script>
  </body>
</html>
